# cargo-deny 依赖治理：漏洞公告 / 许可证 / 重复与来源约束。
# 本地运行：cargo deny --manifest-path src-tauri/Cargo.toml check
# CI 由 EmbarkStudios/cargo-deny-action 执行同一配置（见 .github/workflows/ci.yml）。

[advisories]
version = 2
# yanked 版本仅告警：传递依赖中出现 yanked 时先提示，由人工评估后升级。
yanked = "warn"
ignore = [
  # hickory-proto 0.24 的 DNS 编码 O(n²) DoS；修复在 0.26.1，
  # 升级需迁移 staging.rs 的 resolver API（0.25+ 重写），单独排期处理。
  { id = "RUSTSEC-2026-0119", reason = "等待 hickory-resolver 0.24→0.26 迁移" },
  # proc-macro-error 停止维护；仅 Linux 目标经 gtk 传递引入，上游 tauri 依赖栈决定。
  { id = "RUSTSEC-2024-0370", reason = "传递依赖，非漏洞，仅 unmaintained" },
  # unic-char-property 停止维护；经 urlpattern（tauri-utils / tauri-plugin-http）传递。
  { id = "RUSTSEC-2025-0081", reason = "传递依赖，非漏洞，仅 unmaintained" },
  # unic-* 家族（char-range / common / ucd-ident / ucd-version）同上，均经 urlpattern 传递。
  { id = "RUSTSEC-2025-0075", reason = "传递依赖，非漏洞，仅 unmaintained" },
  { id = "RUSTSEC-2025-0080", reason = "传递依赖，非漏洞，仅 unmaintained" },
  { id = "RUSTSEC-2025-0098", reason = "传递依赖，非漏洞，仅 unmaintained" },
  { id = "RUSTSEC-2025-0100", reason = "传递依赖，非漏洞，仅 unmaintained" },
]

[licenses]
version = 2
# 覆盖当前依赖树的宽松许可证；新增依赖引入列表外许可证时 CI 会失败，
# 此时先确认许可证可接受，再把它加进来（或换掉该依赖）。
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# 重复版本先告警不阻断；等某次瘦身需求时再收敛成 deny。
multiple-versions = "warn"
# 禁止通配符版本要求，保证锁文件是唯一事实来源。
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
