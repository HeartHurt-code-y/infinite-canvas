[package]
name = "infinite-canvas"
version = "1.2.3"
description = "A Tauri desktop application for an infinite canvas"
# publish = false 的私有应用；此字段仅为满足 cargo-deny 许可证治理。
license = "MIT"
edition = "2024"
# edition 2024 本身要求 1.85，但本仓库的代码在用 let-chains（`if let … && let …`，
# 2024 版稳定于 Rust 1.88）；依赖里 `notify-rust 4.18`（经 tauri-plugin-notification）
# 又要求 1.89。MSRV 声明要覆盖真正能编过这份代码的最低版本，否则用 1.88 的机器
# 会在依赖解析阶段撞上 "requires rustc 1.89.0 or newer" 这种难以定位的报错。
rust-version = "1.89"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infinite_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4.3"
hex = "0.4"
hmac = "0.12"
minisign-verify = "0.2.5"
dirs = "6"
dunce = "1.0.5"
infer = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
rand = "0.9"
regex = "1"
# system-proxy: 启用 Windows 注册表 / macOS 系统配置代理读取（企业代理环境适配；
# 环境变量 HTTP_PROXY/HTTPS_PROXY/NO_PROXY 由 reqwest 默认自动读取）
# rustls-tls-native-roots: 信任操作系统证书存储（企业 MITM 解密代理把根证书装入
# Windows 证书存储后即可通过 TLS 校验）；原 rustls-tls(webpki 内置根) 会被企业
# 解密代理拦截而失败
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
ffmpeg-sidecar = "2.5.2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
# 凭据自检需要在系统临时目录建一个一次性凭据文件（不碰用户数据）。
tempfile = "3"
tar = "0.4"
unicode-normalization = "0.1"
ttf-parser = "0.25.1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

# 原先这里有 [dev-dependencies] tokio（macros / rt-multi-thread / test-util），
# 只为 `#[tokio::test]` 与时间暂停服务。测试资产已整体移除，生产代码也不用
# tokio 的 macros / rt-multi-thread（异步走 tauri::async_runtime），故整段删除。

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# 系统凭据存储（API Key / AK-SK）必须按平台启用 keyring 的原生后端。
#
# keyring 在没有启用任何平台后端 feature 时会**静默**退回内存 mock 实现
# （keyring::default 被解析为 keyring::mock），而 mock 的每一次 Entry::new 都是
# 一个全新的空存储，于是「保存成功」之后紧接着的读取永远返回 NoEntry。
# 之前的写法只在公共 [dependencies] 里声明 features = ["windows-native"]，
# 该 feature 在 macOS 上完全不生效（windows 模块带 target_os = "windows" 门禁），
# 导致 macOS 安装包所有密钥「配不上、拉不到」（not found: credential ...）。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# macOS / iOS 走 Security.framework 的登录钥匙串（MacCredentialBuilder），
# 持久化级别为 UntilDelete，与 Windows 行为一致。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

# Linux 及其他平台不发布安装包：保持默认不启用后端即可编译，
# credentials.rs 的持久化守卫会让这类平台显式报错而不是静默丢密钥。
# 若将来需要 Linux 原生支持，追加 features = ["sync-secret-service", "crypto-rust"]
# 并在 CI 安装 libdbus-1-dev。
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", default-features = false }

# 非 Windows 平台用「独立进程组 + killpg」回收渲染子进程树
# （见 src/backend/process_tree.rs）。libc 早已是依赖树成员，不引入新包。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 不要在这里设 panic = "abort"（保持默认 unwind），有两个理由：
# ① 自定义协议处理器、tokio worker、命令线程里的单次 panic 必须能在任务边界被捕获
#    并留下 panic.log，而不是让整个画布进程立刻 SIGABRT——否则一条坏素材就会闪退，
#    macOS 崩溃报告里也只剩 abort() called。
# ② 更关键：objc2 文档明确 panic = "abort" 时 objc2::exception::catch 抓不住
#    Objective-C 异常；wry 在 macOS 上对 WKURLSchemeTask 的 didReceiveResponse /
#    didReceiveData / didFinish 调用正是靠这个 catch 兜住 WebKit 抛出的 NSException
#    （任务被 stop 的竞态）。abort 会把本可恢复的 NSException 直接变成进程 abort，
#    因此 release 必须保留默认 unwind。
# 保留符号表、只去掉 DWARF：将来 macOS .ips 崩溃报告里的 app 帧才能符号化/demangle，
# 不再只能看偏移；release 本身不生成 DWARF，所以体积增量相对可控。
# debug = "line-tables-only"：只为在 macOS 构建时产出可归档的 dSYM（行号级符号），
# 发布产物仍由下面的 strip = "debuginfo" 去掉 DWARF，安装包体积不受影响；CI 会把
# dSYM 作为单独 artifact 归档（codemagic.yaml 的「收集 dSYM」步骤）。
debug = "line-tables-only"
strip = "debuginfo"

# 本地 fork 的 wry 0.55.1：macOS 自定义协议回写路径做一组「不再 abort 进程」的补丁（详见
# vendor/wry/VENDORED-PATCH.md）：
# 1) Foundation 的 NSData / NSHTTPURLResponse 调用全部包进 objc2::exception::catch，
#    避免 NSException 穿过 Rust 帧直接把进程 abort（wry 上游 0.55/0.57 都未覆盖）；
# 2) 响应体所有权直接转移进 NSData（等价 wry 0.57），去掉每个响应的二次整包拷贝，
#    降低大图/大视频预览的瞬时内存峰值；
# 3) 主线程回调里（start_task / 404 应答）不再有 unwrap 等 Rust panic 点，锁中毒也不再
#    让后续协议永久 panic。
# 升级 tauri/wry 时必须先评估上游是否已修复，再按 VENDORED-PATCH.md 重打补丁。
[patch.crates-io]
wry = { path = "vendor/wry" }
