[package]
name = "infinite-canvas"
version = "0.1.0"
description = "A Tauri desktop application for an infinite canvas"
edition = "2024"
rust-version = "1.85"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infinite_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4.3"
hex = "0.4"
hmac = "0.12"
infer = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rand = "0.9"
regex = "1"
# system-proxy: 启用 Windows 注册表 / macOS 系统配置代理读取（企业代理环境适配；
# 环境变量 HTTP_PROXY/HTTPS_PROXY/NO_PROXY 由 reqwest 默认自动读取）
# rustls-tls-native-roots: 信任操作系统证书存储（企业 MITM 解密代理把根证书装入
# Windows 证书存储后即可通过 TLS 校验）；原 rustls-tls(webpki 内置根) 会被企业
# 解密代理拦截而失败
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-upload = "2"
tauri-plugin-websocket = "2"
ffmpeg-sidecar = "2.5.2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
