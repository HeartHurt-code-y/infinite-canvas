name: macOS Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS installer
        run: pnpm tauri:build
        env:
          CI: true

      - name: Upload installer artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infinite-canvas-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Publish artifact download links
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;

            const listUrl = `${{ github.server_url }}/${owner}/${repo}/actions/runs/${runId}`;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });
            const artifacts = response.data.artifacts.filter((artifact) =>
              artifact.name.startsWith("infinite-canvas-macos-")
            );
            const lines = [
              "## macOS 包已构建完成 ✅",
              `- [本次运行页面](${listUrl})`,
              "",
              "### 可下载产物",
            ];
            if (artifacts.length === 0) {
              lines.push("- 未检索到以 `infinite-canvas-macos-` 开头的产物，请检查构建日志。");
            } else {
              for (const artifact of artifacts) {
                const artifactName = artifact.name || "unknown-artifact";
                const downloadUrl = artifact.archive_download_url || listUrl;
                lines.push(`- [${artifactName}](${downloadUrl})`);
              }
            }
            await core.summary.addRaw(lines.join("\n")).write();
