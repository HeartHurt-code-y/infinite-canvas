name: macOS Package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      artifact_url: ${{ steps.publish-artifact-links.outputs.artifact_url }}
      artifact_name: ${{ steps.publish-artifact-links.outputs.artifact_name }}
      run_url: ${{ steps.publish-artifact-links.outputs.run_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS installer
        run: pnpm tauri:build
        env:
          CI: true

      - name: Upload installer artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infinite-canvas-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Publish artifact download links
        if: success()
        id: publish-artifact-links
        env:
          ARTIFACT_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
          ARTIFACT_NAME: infinite-canvas-macos-${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "run_url=${RUN_URL}"
            if [ -n "${ARTIFACT_URL}" ]; then
              echo "artifact_url=${ARTIFACT_URL}"
              echo "artifact_name=${ARTIFACT_NAME}"
            else
              echo "artifact_url="
              echo "artifact_name="
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "## macOS 包已构建完成 ✅"
            echo "- [本次运行页面](${RUN_URL})"
            echo ""
            echo "### 可下载产物"
            if [ -n "${ARTIFACT_URL}" ]; then
              echo "- [${ARTIFACT_NAME}](${ARTIFACT_URL})"
            else
              echo "- 未检索到上传产物链接，请检查上一步 Upload installer artifacts。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
