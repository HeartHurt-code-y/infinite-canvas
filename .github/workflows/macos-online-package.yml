name: macOS Online Package

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac architecture
        type: choice
        options:
          - arm64
          - x64
        default: arm64
      publish:
        description: Publish verified artifacts and the independent online update feed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-online-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 180
    env:
      CI: "true"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache "$HOME/Library/Developer/CoreSimulator" /usr/local/lib/android
          df -h /
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Confirm native architecture and version
        env:
          EXPECTED_ARCH: ${{ inputs.architecture }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json")); const t=JSON.parse(readFileSync("src-tauri/tauri.conf.json")); if(p.version!==t.version) throw Error("Package and Tauri versions differ");'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check distribution prerequisites
        run: |
          export IC_PYTHON_INTERPRETER="$(command -v python3)"
          "$IC_PYTHON_INTERPRETER" -c 'import sqlite3; import sys; assert sys.version_info >= (3, 9)'
      - name: Prepare optional signing identity
        run: bash scripts/prepare-macos-online-signing.sh
      # Cache the prepared native runtime resources (the bundled FFmpeg engine),
      # not application-version catalogs or installers. Every prepare command
      # still validates the files it restores.
      - name: Restore prepared runtime resources
        id: runtime-resources-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            src-tauri/resources/ffmpeg
          # Some legacy preparers only validate existing bytes, rather than their
          # complete recipe identity. Exact keys prevent restoring an older recipe.
          key: macos-online-resources-v1-${{ runner.os }}-${{ inputs.architecture }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/prepare-*.mjs', 'scripts/*runtime*.mjs', 'scripts/macos-runtime-signature.mjs', '!scripts/**/*.test.mjs', '!tools/**/*.test.mjs') }}
      - name: Report runtime resource cache
        env:
          CACHE_HIT: ${{ steps.runtime-resources-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.runtime-resources-cache.outputs.cache-matched-key }}
        run: |
          {
            echo '### Prepared runtime resource cache'
            echo "- Exact input match: ${CACHE_HIT:-false}"
            echo "- Restored key: ${CACHE_MATCHED_KEY:-none}"
            echo '- Preparation and integrity checks always run; unchanged verified resources are reused.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify online DMG and updater
        id: verified-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build-macos-online.sh
      # Save immediately after native verification, so a later publication or
      # artifact-upload failure does not discard successfully prepared resources.
      - name: Save verified runtime resources
        if: steps.verified-build.outcome == 'success' && steps.runtime-resources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            src-tauri/resources/ffmpeg
          key: ${{ steps.runtime-resources-cache.outputs.cache-primary-key }}
      - name: Upload installation artifacts
        # Preserve materialized packages when verification fails, for diagnosis.
        # Only the verified-build success path below can publish them publicly.
        if: ${{ !cancelled() && hashFiles('.cache/tauri-editions/online/artifacts/*/distribution.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: infinite-canvas-macos-online-${{ inputs.architecture }}-${{ github.sha }}
          path: |
            .cache/tauri-editions/online/artifacts/*/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish verified online release
        if: inputs.publish && steps.verified-build.outcome == 'success'
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm update:publish:online --distribution-dir ".cache/tauri-editions/online/artifacts/$version"
      - name: Report installation boundary
        run: |
          {
            echo 'macOS online PKG, DMG and updater signature verified. The PKG was actually installed with the system installer.'
            echo 'Installation scripts are embedded. Install the PKG with: sudo installer -pkg <downloaded.pkg> -target /'
            echo 'Apple notarization is not performed. Gatekeeper may block first installation; the PKG embeds install-macos.sh and runs it automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
