name: macOS Online Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-online-arm64
  cancel-in-progress: false

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 160
    env:
      CI: "true"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: e5a19b05aafe354d73a662d8296b524a68c7c322
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore encrypted 2.6.0 source
        env:
          IC_RELEASE_SNAPSHOT_KEY: ${{ secrets.IC_RELEASE_MAC_260_SOURCE_KEY }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ic-release-source"
          git show "$GITHUB_SHA:.github/release-input/mac-260-index.json" > "$RUNNER_TEMP/ic-release-source.json"
          node --input-type=module <<'NODE'
          import { createDecipheriv, createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const temp = process.env.RUNNER_TEMP;
          const key = process.env.IC_RELEASE_SNAPSHOT_KEY?.trim() ?? '';
          if (!/^[a-f0-9]{64}$/.test(key)) throw new Error('Missing encrypted source key');
          const index = JSON.parse(readFileSync(path.join(temp, 'ic-release-source.json'), 'utf8'));
          if (index.base !== 'e5a19b05aafe354d73a662d8296b524a68c7c322' || !Array.isArray(index.parts) ||
              !index.parts.every(name => /^mac-260-source\.enc\.[0-9]+$/.test(name)))
            throw new Error('Invalid source snapshot descriptor');
          const bytes = Buffer.concat(index.parts.map(name => execFileSync('git',
            ['show', process.env.GITHUB_SHA + ':.github/release-input/' + name], { maxBuffer: 60 * 1024 ** 2 })));
          const decipher = createDecipheriv('aes-256-gcm', Buffer.from(key, 'hex'), bytes.subarray(0,12));
          decipher.setAuthTag(bytes.subarray(-16));
          const archive = Buffer.concat([decipher.update(bytes.subarray(12,-16)),decipher.final()]);
          if (createHash('sha256').update(archive).digest('hex') !== index.sourceSha256)
            throw new Error('Source snapshot digest mismatch');
          writeFileSync(path.join(temp, 'ic-release-source.tar.gz'), archive, {mode:0o600});
          const helper = execFileSync('git',['show',process.env.GITHUB_SHA+':.github/release-input/mac-260-archive-helper.enc']);
          const runner = createDecipheriv('aes-256-gcm', Buffer.from(key,'hex'), helper.subarray(0,12));
          runner.setAuthTag(helper.subarray(-16));
          writeFileSync(path.join(temp,'mac-260-archive-helper.mjs'),Buffer.concat([runner.update(helper.subarray(12,-16)),runner.final()]),{mode:0o600});
          NODE
          tar -xzf "$RUNNER_TEMP/ic-release-source.tar.gz" -C "$RUNNER_TEMP/ic-release-source"
          node --input-type=module <<'NODE'
          import { cpSync, readFileSync, rmSync } from 'node:fs';
          import path from 'node:path';
          const source = path.join(process.env.RUNNER_TEMP, 'ic-release-source');
          for (const entry of JSON.parse(readFileSync(path.join(source, 'removed.json'), 'utf8'))) {
            if (path.isAbsolute(entry) || entry.split('/').some(part => !part || part === '..' || part === '.git'))
              throw new Error('Unsafe source removal');
            rmSync(path.resolve(entry), {force:true});
          }
          cpSync(path.join(source, 'files'), process.cwd(), {recursive:true});
          NODE
          cp "$RUNNER_TEMP/mac-260-archive-helper.mjs" scripts/macos-online-delta.mjs
          git show "$GITHUB_SHA:.github/release-input/mac-260-seed-runtime.mjs" > scripts/mac-260-seed-runtime.mjs
          git show "$GITHUB_SHA:.github/release-input/mac-260-seal-log.mjs" > "$RUNNER_TEMP/ic-seal-build-log.mjs"
          git show "$GITHUB_SHA:.github/release-input/mac-260-live-upgrade.mjs" > scripts/verify-macos-live-upgrade-2.6.0.mjs
          test "$(node -p "require('./package.json').version")" = 2.6.0
          test "$(uname -m)" = arm64 && test "$(node -p 'process.arch')" = arm64
          rm -rf "$RUNNER_TEMP/ic-release-source"
          rm -f "$RUNNER_TEMP/ic-release-source.tar.gz"
          echo 'Encrypted build inputs restored on native arm64.'
      - name: Restore verified native FFmpeg from the signed baseline
        run: node scripts/mac-260-seed-runtime.mjs
      - name: Prepare dependencies and check compilers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IC_RELEASE_SNAPSHOT_KEY: ${{ secrets.IC_RELEASE_MAC_260_SOURCE_KEY }}
        run: |
          if env -u IC_RELEASE_SNAPSHOT_KEY bash -e -c \
            'pnpm install --frozen-lockfile && pnpm ffmpeg:prepare && pnpm typecheck && pnpm rust:check' \
            > "$RUNNER_TEMP/ic-native-build.log" 2>&1; then
            echo 'TypeScript and Rust compiler checks passed on Apple Silicon.'
          else
            node "$RUNNER_TEMP/ic-seal-build-log.mjs"
            exit 1
          fi
      - name: Build signed installer and verify native installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IC_RELEASE_SNAPSHOT_KEY: ${{ secrets.IC_RELEASE_MAC_260_SOURCE_KEY }}
        run: |
          started=$(date +%s)
          if env -u IC_RELEASE_SNAPSHOT_KEY bash -e -c \
            'bash scripts/prepare-macos-online-signing.sh && bash scripts/build-macos-online.sh' \
            > "$RUNNER_TEMP/ic-native-build.log" 2>&1; then
            echo "Native build and installation verified in $(( $(date +%s) - started )) seconds."
            grep -E 'Verified macOS|Finished .*release|Native one-command PKG' "$RUNNER_TEMP/ic-native-build.log" || true
          else
            node "$RUNNER_TEMP/ic-seal-build-log.mjs"
            exit 1
          fi
      - name: Stage, reconstruct and publish the signed macOS delta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          IC_RELEASE_SNAPSHOT_KEY: ${{ secrets.IC_RELEASE_MAC_260_SOURCE_KEY }}
        run: |
          export IC_MAC_BASELINE_ARCHIVE="$RUNNER_TEMP/ic-baseline-2.0.1.tar.gz"
          if env -u IC_RELEASE_SNAPSHOT_KEY node --input-type=module > "$RUNNER_TEMP/ic-native-build.log" 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { prepareOnlinePublication, publishVerifiedOnlinePlan } from './scripts/publish-online-updates.mjs';
          import { prepareMacOnlineDelta } from './scripts/macos-online-delta.mjs';
          import { verifyEditionRelease } from './scripts/verify-edition-release.mjs';
          const plan = await prepareOnlinePublication({distributionDirectory:'.cache/tauri-editions/online/artifacts/2.6.0'});
          assert.equal(plan.platform,'darwin-aarch64');
          const candidate = await prepareMacOnlineDelta(plan);
          try {
            assert.equal(candidate.plan.requiredPreviousFeedSha256,'35f8cd607dcd6d343f4522994e811e810acfdb87073af741fa4b4061a99262be');
            assert.equal(candidate.plan.macDelta.baseVersion,'2.0.1');
            const report = await publishVerifiedOnlinePlan({
              plan:candidate.plan, verifyRelease:verifyEditionRelease, updaterOnly:true,
              onProgress: item => {
                if (item.phase === 'feed-committed' || item.phase === 'uploaded') console.log(JSON.stringify(item));
              },
            });
            assert.equal(report.published,true);
            assert.equal(report.publicObjectsVerified,true);
            writeFileSync(path.join(process.env.RUNNER_TEMP,'mac-260-publish.json'), JSON.stringify({
              version:report.applicationVersion, ...report.macDelta,
              feed:report.feed, objects:report.objects, previousBackup:report.previousFeedBackup,
              nativeReconstructionVerified:true, publicObjectsVerified:true,
            },null,2) + '\n');
          } finally {
            await candidate.dispose();
          }
          NODE
          then
            cat "$RUNNER_TEMP/mac-260-publish.json"
          else
            node "$RUNNER_TEMP/ic-seal-build-log.mjs"
            exit 1
          fi
      - name: Verify automatic upgrade from the published feed
        run: |
          export IC_MAC_BASELINE_ARCHIVE="$RUNNER_TEMP/ic-baseline-2.0.1.tar.gz"
          node scripts/verify-macos-live-upgrade-2.6.0.mjs
      - name: Retain release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-2.6.0-arm64-release-receipts
          path: |
            ${{ runner.temp }}/mac-260-publish.json
            ${{ runner.temp }}/ic-live-upgrade-evidence/native-delta-upgrade.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain verified native packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-2.6.0-arm64-native-packages
          path: .cache/tauri-editions/online/artifacts/2.6.0/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Retain encrypted diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-2.6.0-encrypted-errors
          path: ${{ runner.temp }}/ic-native-build.log.enc
          if-no-files-found: ignore
          retention-days: 2

