name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bundle.resources 指向的两个引擎目录由 prepare 脚本生成且被 gitignore，
      # Tauri build script 在 clippy 编译时也会校验其存在，必须先行准备
      # （与 tauri.conf.json 的 beforeDevCommand / beforeBuildCommand 保持一致）。
      - name: Prepare bundled engines
        run: pnpm ffmpeg:prepare && pnpm remotion:prepare && pnpm blender:prepare

      - name: Run project checks
        run: pnpm check

      # 前端测试由 check:frontend 覆盖，Rust 用例此前没有任何 CI 入口，
      # 导致 provider 的请求体用例长期失败而无人发现；单独一步让它在 CI 里必须通过。
      # 需要打包引擎的用例都带 #[ignore]（见 remotion_renderer / cover_images），
      # 因此 --lib 在无需预置资源的情况下即可稳定运行。
      - name: Run Rust unit tests
        run: pnpm rust:test

      - name: Build frontend
        run: pnpm build
