name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Rust 侧依赖治理：漏洞公告 + 许可证 + 来源约束（配置见 deny.toml）。
      # 本地复现：cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: Check Rust dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --manifest-path src-tauri/Cargo.toml check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端依赖治理：生产依赖漏洞审计 + 未使用依赖检测（配置见 knip.json）。
      - name: Check frontend production vulnerabilities
        run: pnpm audit --prod

      - name: Check unused dependencies (knip)
        run: pnpm knip

      # bundle.resources 指向的引擎目录由 prepare 脚本生成且被 gitignore，
      # Tauri build script 编译时也会校验其存在，必须先行准备
      # （与 tauri.conf.json 的 beforeDevCommand / beforeBuildCommand 保持一致）。
      - name: Prepare bundled engines
        run: pnpm ffmpeg:prepare

      - name: Run project checks
        run: pnpm check

      # Rust 侧仍然要编译：clippy 门禁已移除，但「能编过」这件事不能没人管。
      # cargo check 只编译、不跑 lint，也不执行任何测试。
      - name: Compile Rust code
        run: pnpm rust:check

      - name: Build frontend
        run: pnpm build
